name: Python SDK compatibility

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Windows Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install wheel
        run: python -m pip install --no-deps ./python
      - name: Run SDK tests against installed wheel
        run: python -m unittest discover -s python/tests -v
      - name: Compile Python sources and tests
        run: python -m compileall -q python/src python/tests
