name: Publish Python package to PyPI

on:
  push:
    tags:
      - "pypi-v*"
  workflow_dispatch:

jobs:
  sdk-tests:
    uses: ./.github/workflows/python-compatibility.yml

  build:
    needs: sdk-tests
    name: Build and validate distribution
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Run SDK tests
        shell: pwsh
        run: ./tools/verify.ps1

      - name: Compile firmware and build wheel
        shell: pwsh
        run: ./tools/build-wheel.ps1

      - name: Validate wheel metadata
        run: python -m twine check artifacts/dist/*.whl

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: artifacts/dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish distribution to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/starbridge-hardware/
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Publish GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish release notes and wheel
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const metadata = fs.readFileSync('python/pyproject.toml', 'utf8');
            const version = /^version = "([^"]+)"/m.exec(metadata)[1];
            const tag = `v${version}`;
            const body = fs.readFileSync(`docs/releases/${tag}.md`, 'utf8');
            const repo = context.repo;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({...repo, tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                ...repo, tag_name: tag, target_commitish: context.sha,
                name: `${tag} · Mind+ 兼容版`, body,
                draft: false, prerelease: false,
              })).data;
            }
            for (const name of fs.readdirSync('dist').filter(name => name.endsWith('.whl'))) {
              if (release.assets.some(asset => asset.name === name)) continue;
              await github.rest.repos.uploadReleaseAsset({
                ...repo, release_id: release.id, name,
                data: fs.readFileSync(`dist/${name}`),
                headers: {'content-type': 'application/octet-stream'},
              });
            }
            core.notice(`Published ${release.html_url}`);
